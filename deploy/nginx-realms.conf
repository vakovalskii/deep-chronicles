# nginx: https://realms.neuraldeep.ru — статика /opt/realms/dist (сертификат certbot)
server {
  listen 80;
  server_name realms.neuraldeep.ru;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name realms.neuraldeep.ru;
  ssl_certificate /etc/letsencrypt/live/realms.neuraldeep.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/realms.neuraldeep.ru/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  root /opt/realms/dist;
  index index.html;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  location = /index.html { add_header Cache-Control no-cache; }
  location /assets/ { expires 30d; add_header Cache-Control public; }
  location /ws { proxy_pass http://127.0.0.1:8790; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }
  location / { try_files $uri $uri/ /index.html; }
}
